# AI 레포 dev CD (develop 브랜치 → V2 ECS·V3 EKS 개발 환경)
# - 트리거: develop, hotfix/** push (hotfix는 운영 반영 전 dev 검증용)
# - 이미지는 한 번만 빌드해 V2 ECS와 V3 EKS에서 동일한 digest를 사용한다.
#   · V2: ECS Task Definition 갱신
#   · V3: GitOps 저장소에 digest 갱신 요청 → Argo CD Auto Sync
#   · AWS Role: dev 전용 Role (develop Environment로 실행된 워크플로만 사용 가능)
#   · GitHub Environment: production 대신 develop
#     (변수 이름은 prod와 같고, 값은 develop Environment에 dev 값으로 등록한다)
#     (develop Environment의 Deployment branches를 develop, hotfix/*로 제한해야 한다)
name: AI dev CD

run-name: >-
  ${{ github.event_name == 'push'
      && format('AI dev auto deploy - {0}', github.sha)
      || format('AI dev rollback - {0}', inputs.image_tag) }}

on:
  # develop: 평소 dev 배포 / hotfix/**: 운영 반영 전 dev 서버에서 hotfix 검증
  # 개발 배포 누락을 막기 위해 paths 필터를 두지 않는다.
  push:
    branches: ["develop", "hotfix/**"]

  # 수동 실행은 ECR에 이미 있는 이미지로 되돌리는 롤백 전용
  workflow_dispatch:
    inputs:
      image_tag:
        description: "롤백할 ECR 이미지 태그(7자리 SHA)"
        required: true
        type: string
      reason:
        description: "롤백 사유"
        required: true
        type: string

permissions: {}

# 같은 AI 레포의 개발 배포끼리 직렬화한다.
concurrency:
  group: lookddak-ai-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lookddak-dev-fastapi

jobs:
  build-and-push:
    name: dev-build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment: develop
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Guard - develop / hotfix 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "develop, hotfix/* 브랜치만 dev 서버에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - build role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # target을 지정하지 않는다 → 최종 runtime 이미지를 빌드한다.
      # runtime 단계가 test 단계의 통과 표시 파일을 COPY하므로
      # ruff/pytest가 실패하면 이미지가 만들어지지 않는다.
      - name: 빌드 및 ECR push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # V2 dev(ECS) 배포.
  # - Task Definition 설정은 CLOUD 레포 Terraform이 S3 템플릿으로 관리한다.
  #   이 job은 템플릿의 __DIGEST__만 이번 이미지 digest로 바꿔 revision을 등록한다.
  # - 실패하면 dev CD 전체 실패로 본다 (main merge 필수 체크).
  # V2 dev(ECS) 배포 중지 (2026-11-08): V3(EKS) 전환으로 V2 배포를 멈춘다.
  # 저장소 변수 V2_DEV_DEPLOY_ENABLED를 두지 않으므로 skipped. 긴급 배포·롤백이 필요하면 변수를 'true'로 만들면 PR 없이 다시 켜진다.
  deploy-v2:
    name: dev-v2-deploy
    needs: build-and-push
    if: >-
      ${{
        always() &&
        vars.V2_DEV_DEPLOY_ENABLED == 'true' &&
        (
          (github.event_name == 'push' && needs.build-and-push.result == 'success') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: develop
    permissions:
      id-token: write
      contents: read
    env:
      ECS_CLUSTER: lookddak-dev-v2
      ECS_SERVICE: lookddak-dev-v2-fastapi-service
      TASK_FAMILY: lookddak-dev-v2-fastapi
      TEMPLATE_KEY: dev/v2/fastapi.json
      APP_CONTAINER_NAME: fastapi
    steps:
      - name: Guard - develop / hotfix 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "develop, hotfix/* 브랜치의 워크플로만 dev 서버에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: 배포 태그와 사유 확정
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_REASON: ${{ inputs.reason }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$BUILT_TAG"
            REASON="${GITHUB_REF_NAME} push by ${GITHUB_ACTOR}"
          else
            TAG="$INPUT_TAG"
            REASON="$INPUT_REASON"
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "태그 형식이 잘못되었습니다: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<__EOF__"
            echo "$REASON"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 태그는 사람이 읽는 이름이고, 배포는 바뀌지 않는 digest로 한다.
      - name: 이미지 digest 조회
        id: image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text) \
          || { echo "ECR에 ${ECR_REPOSITORY}:${TAG} 이미지가 없습니다."; exit 1; }
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest 형식이 잘못되었습니다: '$DIGEST'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # 버킷 이름에 계정 ID가 들어가므로 레포에 적지 않고 실행 시 만든다.
      - name: Task Definition 템플릿 다운로드
        id: template
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lookddak-ecs-taskdef-${ACCOUNT}-${AWS_REGION}"
          VERSION=$(aws s3api get-object \
            --bucket "$BUCKET" --key "$TEMPLATE_KEY" \
            "$RUNNER_TEMP/template.json" \
            --query VersionId --output text)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repository_uri=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      # __DIGEST__만 바꾸고, 결과가 예상과 정확히 같은지 확인한다.
      # 앱 컨테이너는 이름(APP_CONTAINER_NAME)으로 찾는다. 모니터링 사이드카가 함께 있어도 앱 image만 바꾼다.
      # 다른 저장소 이미지나 다른 family로 바뀌지 않게 막는다.
      - name: digest 치환 및 검증
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPOSITORY_URI: ${{ steps.template.outputs.repository_uri }}
        run: |
          TEMPLATE="$RUNNER_TEMP/template.json"
          TASKDEF="$RUNNER_TEMP/taskdef.json"

          jq -e --arg family "$TASK_FAMILY" --arg name "$APP_CONTAINER_NAME" --arg image "${REPOSITORY_URI}@__DIGEST__" '
            .family == $family and
            ([.containerDefinitions[] | select(.name == $name)] | length) == 1 and
            (.containerDefinitions[] | select(.name == $name) | .image) == $image
          ' "$TEMPLATE" > /dev/null \
          || { echo "::error::템플릿이 예상과 다릅니다 (family, 앱 컨테이너 이름, image 확인)"; exit 1; }

          jq --arg name "$APP_CONTAINER_NAME" --arg digest "$DIGEST" \
            '(.containerDefinitions[] | select(.name == $name) | .image) |= sub("@__DIGEST__$"; "@" + $digest)' \
            "$TEMPLATE" > "$TASKDEF"

          if grep -q '__DIGEST__' "$TASKDEF"; then
            echo "::error::치환 후에도 __DIGEST__가 남아 있습니다."
            exit 1
          fi
          jq -e --arg name "$APP_CONTAINER_NAME" --arg image "${REPOSITORY_URI}@${DIGEST}" \
            '(.containerDefinitions[] | select(.name == $name) | .image) == $image' "$TASKDEF" > /dev/null \
          || { echo "::error::치환 결과 image가 예상과 다릅니다."; exit 1; }

          echo "image=$(jq -r --arg name "$APP_CONTAINER_NAME" '.containerDefinitions[] | select(.name == $name) | .image' "$TASKDEF")"

      # revision 등록 → 서비스 갱신만 한다. 안정화 대기는 끈다.
      # 공식 액션(SDK waiter)의 대기는 wait-for-minutes보다 일찍 끝난 사례가 있어
      # (20분 설정, 약 12분에 TIMEOUT), 대기 시간을 다음 단계에서 직접 통제한다.
      - name: ECS 배포
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ runner.temp }}/taskdef.json
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: false

      # 배포가 최종 상태가 될 때까지 직접 기다린다.
      # - PRIMARY = 요청 revision, COMPLETED            → 성공
      # - PRIMARY = 다른 revision(circuit breaker 롤백) → 롤백이 COMPLETED가 될 때까지 기다린 뒤 실패
      # - 롤백 FAILED, 제한 시간 초과                    → 실패
      # 조회 오류는 일시적일 수 있으므로 제한 시간 안에서는 다시 조회한다.
      - name: 배포 결과 확인
        if: ${{ always() && steps.meta.outcome == 'success' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REASON: ${{ steps.meta.outputs.reason }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TEMPLATE_VERSION: ${{ steps.template.outputs.version }}
          REQUESTED: ${{ steps.deploy.outputs.task-definition-arn }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ROLLOUT_TIMEOUT: "1800" # 최종 상태 대기 제한: 30분 (실측 롤백 약 10분)
          POLL_INTERVAL: "15"
        run: |
          read_primary() {
            PRIMARY=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0]' \
              --output json 2>/dev/null || echo 'null')
            ACTUAL=$(echo "$PRIMARY" | jq -r '.taskDefinition // "unknown"')
            ROLLOUT=$(echo "$PRIMARY" | jq -r '.rolloutState // "unknown"')
            ROLLOUT_REASON=$(echo "$PRIMARY" | jq -r '.rolloutStateReason // ""')
          }

          RESULT="deploy-step-failed"
          ACTUAL="unknown"
          ROLLOUT="unknown"
          ROLLOUT_REASON=""
          REQUESTED_STATE=""

          if [[ "$DEPLOY_OUTCOME" == "success" && -n "$REQUESTED" ]]; then
            DEADLINE=$(( $(date +%s) + ROLLOUT_TIMEOUT ))
            RESULT="timeout"
            while true; do
              read_primary
              echo "$(date '+%T') primary=${ACTUAL##*/} rolloutState=${ROLLOUT}"
              if [[ "$ACTUAL" == "$REQUESTED" ]]; then
                REQUESTED_STATE="${ROLLOUT} ${ROLLOUT_REASON}"
                if [[ "$ROLLOUT" == "COMPLETED" ]]; then RESULT="success"; break; fi
              elif [[ "$ACTUAL" != "unknown" ]]; then
                if [[ "$ROLLOUT" == "COMPLETED" ]]; then RESULT="rolled-back"; break; fi
                if [[ "$ROLLOUT" == "FAILED" ]]; then RESULT="rollback-failed"; break; fi
              fi
              if [[ "$(date +%s)" -ge "$DEADLINE" ]]; then break; fi
              sleep "$POLL_INTERVAL"
            done
          else
            read_primary
          fi

          case "$RESULT" in
            success)            SUMMARY="성공" ;;
            rolled-back)        SUMMARY="실패: circuit breaker 롤백 완료 (현재 ${ACTUAL##*/})" ;;
            rollback-failed)    SUMMARY="실패: 롤백까지 실패. 즉시 수동 확인" ;;
            timeout)            SUMMARY="실패: ${ROLLOUT_TIMEOUT}초 안에 최종 상태가 되지 않음" ;;
            deploy-step-failed) SUMMARY="실패: ECS 배포 단계 실패 (outcome=${DEPLOY_OUTCOME})" ;;
          esac

          {
            echo "### AI dev V2(ECS) 배포 결과: ${SUMMARY}"
            echo "- 이벤트: ${GITHUB_EVENT_NAME}"
            echo "- 태그: \`${TAG}\`"
            echo "- 사유: ${REASON}"
            echo "- digest: \`${DIGEST:-조회 실패}\`"
            echo "- 템플릿: \`${TEMPLATE_KEY}\` (S3 버전 \`${TEMPLATE_VERSION:-조회 실패}\`)"
            echo "- 요청 revision: \`${REQUESTED:-등록 안 됨}\` (마지막 상태: ${REQUESTED_STATE:-확인 안 됨})"
            echo "- 현재 PRIMARY revision: \`${ACTUAL}\` (${ROLLOUT} ${ROLLOUT_REASON})"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RESULT" != "success" ]]; then
            echo "::error::V2 배포 ${SUMMARY}"
            exit 1
          fi
          echo "V2 배포 성공: ${ACTUAL}"

  # V3 dev(EKS) 배포는 GitOps 저장소에 동일한 digest의 갱신을 요청한다.
  # 수동 rollback은 V2 전용이므로 push에서 새 이미지를 빌드한 경우에만 실행한다.
  publish-v3-dev:
    name: publish-v3-dev
    needs: build-and-push
    if: ${{ github.event_name == 'push' && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: develop
    permissions:
      contents: read
    steps:
      - name: GitOps GitHub App Token 발급
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_IMAGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEV_IMAGE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: KTB4-15th-GITOPS
          permission-contents: write

      - name: GitOps dev 이미지 갱신 요청
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::빌드 digest 형식이 잘못되었습니다: '$DIGEST'"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::원본 commit SHA 형식이 잘못되었습니다: '$SOURCE_SHA'"
            exit 1
          fi

          jq -n \
            --arg event_type "dev-image-published" \
            --arg environment "dev" \
            --arg image_key "ai" \
            --arg digest "$DIGEST" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_run_url "$SOURCE_RUN_URL" \
            '{
              event_type: $event_type,
              client_payload: {
                environment: $environment,
                image_key: $image_key,
                digest: $digest,
                source_repository: $source_repository,
                source_sha: $source_sha,
                source_run_url: $source_run_url
              }
            }' \
          | gh api --method POST \
              "repos/100-hours-a-week/KTB4-15th-GITOPS/dispatches" \
              --input -

          {
            echo "### AI dev V3(EKS) GitOps 갱신 요청"
            echo "- digest: \`$DIGEST\`"
            echo "- 영향 워크로드: \`chat-ai\`, \`body-image-validator\`, \`vton-orchestrator\`"
            echo "- GitOps 이벤트: \`dev-image-published\`"
            echo "- 원본 실행: $SOURCE_RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
