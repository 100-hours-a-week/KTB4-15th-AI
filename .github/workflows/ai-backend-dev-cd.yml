# AI 레포 dev CD (develop 브랜치 → dev 서버 dev.lookddak.com)
# - 트리거: develop, hotfix/** push (hotfix는 운영 반영 전 dev 검증용)
# - prod CD(ai-backend-cd.yml)와 같은 흐름이고 다른 점만 바꿨다.
#   · 대상: dev ECR(lookddak-dev-fastapi), dev EC2
#   · AWS Role: dev 전용 Role (develop Environment로 실행된 워크플로만 사용 가능)
#   · GitHub Environment: production 대신 develop
#     (변수 이름은 prod와 같고, 값은 develop Environment에 dev 값으로 등록한다)
#     (develop Environment의 Deployment branches를 develop, hotfix/*로 제한해야 한다)
name: AI dev CD

run-name: >-
  ${{ github.event_name == 'push'
      && format('AI dev auto deploy - {0}', github.sha)
      || format('AI dev rollback - {0}', inputs.image_tag) }}

on:
  # develop: 평소 dev 배포 / hotfix/**: 운영 반영 전 dev 서버에서 hotfix 검증
  # paths 필터를 두지 않는다. 이 워크플로의 dev-deploy job이 main merge의 필수 체크라서
  # 문서만 바뀐 커밋에서 실행되지 않으면 main PR이 체크를 계속 기다리게 된다.
  push:
    branches: ["develop", "hotfix/**"]

  # 수동 실행은 ECR에 이미 있는 이미지로 되돌리는 롤백 전용
  workflow_dispatch:
    inputs:
      image_tag:
        description: "롤백할 ECR 이미지 태그(7자리 SHA)"
        required: true
        type: string
      reason:
        description: "롤백 사유"
        required: true
        type: string

permissions: {}

# 같은 AI 레포의 배포끼리만 직렬화. BE/FE와의 충돌은 EC2 flock이 막는다.
concurrency:
  group: lookddak-ai-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lookddak-dev-fastapi
  SERVICE_KEY: ai
  SSM_EXEC_TIMEOUT: "780"   # 13분
  POLL_TIMEOUT: "900"       # 15분 (실측 후 조정)

jobs:
  build-and-push:
    name: dev-build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment: develop
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Guard - develop / hotfix 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "develop, hotfix/* 브랜치만 dev 서버에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - build role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # target을 지정하지 않는다 → 최종 runtime 이미지를 빌드한다.
      # runtime 단계가 test 단계의 통과 표시 파일을 COPY하므로
      # ruff/pytest가 실패하면 이미지가 만들어지지 않는다.
      - name: 빌드 및 ECR push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # main 브랜치 Ruleset의 필수 체크 이름 (prod CD의 deploy job과 구분)
    name: dev-deploy
    needs: build-and-push
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'push' && needs.build-and-push.result == 'success') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: develop
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Guard - develop / hotfix 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "develop, hotfix/* 브랜치의 워크플로만 dev 서버에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: 배포 태그와 사유 확정
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_REASON: ${{ inputs.reason }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$BUILT_TAG"
            REASON="${GITHUB_REF_NAME} push by ${GITHUB_ACTOR}"
          else
            TAG="$INPUT_TAG"
            REASON="$INPUT_REASON"
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "태그 형식이 잘못되었습니다: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<__EOF__"
            echo "$REASON"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 이미지 존재 확인
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" > /dev/null \
          || { echo "ECR에 ${ECR_REPOSITORY}:${TAG} 이미지가 없습니다."; exit 1; }

      - name: SSM으로 배포 요청
        id: send
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          PARAMS=$(jq -nc \
            --arg cmd "/opt/lookddak/scripts/deploy.sh ${SERVICE_KEY} ${TAG} ${GITHUB_RUN_ID}" \
            --arg timeout "$SSM_EXEC_TIMEOUT" \
            '{commands: [$cmd], executionTimeout: [$timeout]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "${SERVICE_KEY}-cd ${TAG} run ${GITHUB_RUN_ID}" \
            --timeout-seconds 60 \
            --parameters "$PARAMS" \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/lookddak/dev/deploy" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: 배포 결과 폴링
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ steps.meta.outputs.tag }}
          REASON: ${{ steps.meta.outputs.reason }}
        run: |
          DEADLINE=$(( $(date +%s) + POLL_TIMEOUT ))
          STATUS="Pending"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "NotYet")
            echo "$(date '+%T') status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 10 ;;
            esac
          done

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --output json 2>/dev/null || echo '{}')
          CODE=$(echo "$RESULT" | jq -r '.ResponseCode // "unknown"')

          echo "----- EC2 스크립트 출력(끝부분) -----"
          echo "$RESULT" | jq -r '.StandardOutputContent // ""' | tail -n 60
          echo "$RESULT" | jq -r '.StandardErrorContent // ""' | tail -n 30

          {
            echo "### AI dev 배포 결과"
            echo "- 이벤트: ${GITHUB_EVENT_NAME}"
            echo "- 태그: \`${TAG}\`"
            echo "- 사유: ${REASON}"
            echo "- SSM 상태: ${STATUS} / 종료 코드: ${CODE}"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$STATUS:$CODE" in
            Success:0) echo "배포 성공"; exit 0 ;;
            *:1)  echo "::error::새 버전 배포 실패 (서비스 미변경 또는 이전 버전 복구됨)"; exit 1 ;;
            *:2)  echo "::error::이전 버전 복구까지 실패! 즉시 수동 확인"; exit 1 ;;
            *:64) echo "::error::EC2 배포 설정 오류 (.env, compose, 명령 설치 상태 확인)"; exit 1 ;;
            *:75) echo "::error::다른 배포가 진행 중이라 시작하지 못함. 끝난 뒤 재실행"; exit 1 ;;
            *)    echo "::error::결과 확인 불가(status=$STATUS). CloudWatch /lookddak/dev/deploy 확인"; exit 1 ;;
          esac