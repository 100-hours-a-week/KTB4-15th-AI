# AI 레포 dev CD (develop 브랜치 → dev 서버 dev.lookddak.com)
# - 트리거: develop, hotfix/** push (hotfix는 운영 반영 전 dev 검증용)
# - prod CD(ai-backend-cd.yml)와 같은 흐름이고 다른 점만 바꿨다.
#   · 대상: dev ECR(lookddak-dev-fastapi), dev EC2
#   · AWS Role: dev 전용 Role (develop Environment로 실행된 워크플로만 사용 가능)
#   · GitHub Environment: production 대신 develop
#     (변수 이름은 prod와 같고, 값은 develop Environment에 dev 값으로 등록한다)
#     (develop Environment의 Deployment branches를 develop, hotfix/*로 제한해야 한다)
name: AI dev CD

run-name: >-
  ${{ github.event_name == 'push'
      && format('AI dev auto deploy - {0}', github.sha)
      || format('AI dev rollback - {0} ({1})', inputs.image_tag, inputs.target) }}

on:
  # develop: 평소 dev 배포 / hotfix/**: 운영 반영 전 dev 서버에서 hotfix 검증
  # paths 필터를 두지 않는다. 이 워크플로의 dev-deploy job이 main merge의 필수 체크라서
  # 문서만 바뀐 커밋에서 실행되지 않으면 main PR이 체크를 계속 기다리게 된다.
  push:
    branches: ["develop", "hotfix/**"]

  # 수동 실행은 ECR에 이미 있는 이미지로 되돌리는 롤백 전용
  workflow_dispatch:
    inputs:
      image_tag:
        description: "롤백할 ECR 이미지 태그(7자리 SHA)"
        required: true
        type: string
      reason:
        description: "롤백 사유"
        required: true
        type: string
      # all: V1(EC2) + V2(ECS) / v1: EC2만 / v2: ECS만
      # 한쪽만 다시 배포하거나, 다른 쪽에 영향 없이 배포 실패 경로를 검증할 때 사용한다.
      target:
        description: "배포 대상 (all: V1+V2, v1: EC2만, v2: ECS만)"
        required: true
        default: all
        type: choice
        options:
          - all
          - v1
          - v2

permissions: {}

# 같은 AI 레포의 배포끼리만 직렬화. BE/FE와의 충돌은 EC2 flock이 막는다.
concurrency:
  group: lookddak-ai-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lookddak-dev-fastapi
  SERVICE_KEY: ai
  SSM_EXEC_TIMEOUT: "780"   # 13분
  POLL_TIMEOUT: "900"       # 15분 (실측 후 조정)

jobs:
  build-and-push:
    name: dev-build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment: develop
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Guard - develop / hotfix 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "develop, hotfix/* 브랜치만 dev 서버에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - build role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # target을 지정하지 않는다 → 최종 runtime 이미지를 빌드한다.
      # runtime 단계가 test 단계의 통과 표시 파일을 COPY하므로
      # ruff/pytest가 실패하면 이미지가 만들어지지 않는다.
      - name: 빌드 및 ECR push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # main 브랜치 Ruleset의 필수 체크 이름 (prod CD의 deploy job과 구분)
    name: dev-deploy
    needs: build-and-push
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'push' && needs.build-and-push.result == 'success') ||
          (github.event_name == 'workflow_dispatch' && inputs.target != 'v2')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: develop
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Guard - develop / hotfix 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "develop, hotfix/* 브랜치의 워크플로만 dev 서버에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: 배포 태그와 사유 확정
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_REASON: ${{ inputs.reason }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$BUILT_TAG"
            REASON="${GITHUB_REF_NAME} push by ${GITHUB_ACTOR}"
          else
            TAG="$INPUT_TAG"
            REASON="$INPUT_REASON"
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "태그 형식이 잘못되었습니다: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<__EOF__"
            echo "$REASON"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 이미지 존재 확인
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" > /dev/null \
          || { echo "ECR에 ${ECR_REPOSITORY}:${TAG} 이미지가 없습니다."; exit 1; }

      - name: SSM으로 배포 요청
        id: send
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          PARAMS=$(jq -nc \
            --arg cmd "/opt/lookddak/scripts/deploy.sh ${SERVICE_KEY} ${TAG} ${GITHUB_RUN_ID}" \
            --arg timeout "$SSM_EXEC_TIMEOUT" \
            '{commands: [$cmd], executionTimeout: [$timeout]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "${SERVICE_KEY}-cd ${TAG} run ${GITHUB_RUN_ID}" \
            --timeout-seconds 60 \
            --parameters "$PARAMS" \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/lookddak/dev/deploy" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: 배포 결과 폴링
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ steps.meta.outputs.tag }}
          REASON: ${{ steps.meta.outputs.reason }}
        run: |
          DEADLINE=$(( $(date +%s) + POLL_TIMEOUT ))
          STATUS="Pending"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "NotYet")
            echo "$(date '+%T') status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 10 ;;
            esac
          done

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --output json 2>/dev/null || echo '{}')
          CODE=$(echo "$RESULT" | jq -r '.ResponseCode // "unknown"')

          echo "----- EC2 스크립트 출력(끝부분) -----"
          echo "$RESULT" | jq -r '.StandardOutputContent // ""' | tail -n 60
          echo "$RESULT" | jq -r '.StandardErrorContent // ""' | tail -n 30

          {
            echo "### AI dev 배포 결과"
            echo "- 이벤트: ${GITHUB_EVENT_NAME}"
            echo "- 태그: \`${TAG}\`"
            echo "- 사유: ${REASON}"
            echo "- SSM 상태: ${STATUS} / 종료 코드: ${CODE}"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$STATUS:$CODE" in
            Success:0) echo "배포 성공"; exit 0 ;;
            *:1)  echo "::error::새 버전 배포 실패 (서비스 미변경 또는 이전 버전 복구됨)"; exit 1 ;;
            *:2)  echo "::error::이전 버전 복구까지 실패! 즉시 수동 확인"; exit 1 ;;
            *:64) echo "::error::EC2 배포 설정 오류 (.env, compose, 명령 설치 상태 확인)"; exit 1 ;;
            *:75) echo "::error::다른 배포가 진행 중이라 시작하지 못함. 끝난 뒤 재실행"; exit 1 ;;
            *)    echo "::error::결과 확인 불가(status=$STATUS). CloudWatch /lookddak/dev/deploy 확인"; exit 1 ;;
          esac

  # V2 dev(ECS) 배포. V1 dev-deploy와 같은 이미지(태그)를 병렬로 배포한다.
  # - Task Definition 설정은 CLOUD 레포 Terraform이 S3 템플릿으로 관리한다.
  #   이 job은 템플릿의 __DIGEST__만 이번 이미지 digest로 바꿔 revision을 등록한다.
  # - 실패하면 dev CD 전체 실패로 본다 (main merge 필수 체크).
  deploy-v2:
    name: dev-v2-deploy
    needs: build-and-push
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'push' && needs.build-and-push.result == 'success') ||
          (github.event_name == 'workflow_dispatch' && inputs.target != 'v1')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: develop
    permissions:
      id-token: write
      contents: read
    env:
      ECS_CLUSTER: lookddak-dev-v2
      ECS_SERVICE: lookddak-dev-v2-fastapi-service
      TASK_FAMILY: lookddak-dev-v2-fastapi
      TEMPLATE_KEY: dev/v2/fastapi.json
    steps:
      - name: Guard - develop / hotfix 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "develop, hotfix/* 브랜치의 워크플로만 dev 서버에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: 배포 태그와 사유 확정
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_REASON: ${{ inputs.reason }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$BUILT_TAG"
            REASON="${GITHUB_REF_NAME} push by ${GITHUB_ACTOR}"
          else
            TAG="$INPUT_TAG"
            REASON="$INPUT_REASON"
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "태그 형식이 잘못되었습니다: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<__EOF__"
            echo "$REASON"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 태그는 사람이 읽는 이름이고, 배포는 바뀌지 않는 digest로 한다.
      - name: 이미지 digest 조회
        id: image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text) \
          || { echo "ECR에 ${ECR_REPOSITORY}:${TAG} 이미지가 없습니다."; exit 1; }
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest 형식이 잘못되었습니다: '$DIGEST'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # 버킷 이름에 계정 ID가 들어가므로 레포에 적지 않고 실행 시 만든다.
      - name: Task Definition 템플릿 다운로드
        id: template
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lookddak-ecs-taskdef-${ACCOUNT}-${AWS_REGION}"
          VERSION=$(aws s3api get-object \
            --bucket "$BUCKET" --key "$TEMPLATE_KEY" \
            "$RUNNER_TEMP/template.json" \
            --query VersionId --output text)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repository_uri=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      # __DIGEST__만 바꾸고, 결과가 예상과 정확히 같은지 확인한다.
      # 다른 저장소 이미지나 다른 family로 바뀌지 않게 막는다.
      - name: digest 치환 및 검증
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPOSITORY_URI: ${{ steps.template.outputs.repository_uri }}
        run: |
          TEMPLATE="$RUNNER_TEMP/template.json"
          TASKDEF="$RUNNER_TEMP/taskdef.json"

          jq -e --arg family "$TASK_FAMILY" --arg image "${REPOSITORY_URI}@__DIGEST__" '
            .family == $family and
            (.containerDefinitions | length) == 1 and
            .containerDefinitions[0].image == $image
          ' "$TEMPLATE" > /dev/null \
          || { echo "::error::템플릿이 예상과 다릅니다 (family, 컨테이너 수, image 확인)"; exit 1; }

          jq --arg digest "$DIGEST" \
            '.containerDefinitions[0].image |= sub("@__DIGEST__$"; "@" + $digest)' \
            "$TEMPLATE" > "$TASKDEF"

          if grep -q '__DIGEST__' "$TASKDEF"; then
            echo "::error::치환 후에도 __DIGEST__가 남아 있습니다."
            exit 1
          fi
          jq -e --arg image "${REPOSITORY_URI}@${DIGEST}" \
            '.containerDefinitions[0].image == $image' "$TASKDEF" > /dev/null \
          || { echo "::error::치환 결과 image가 예상과 다릅니다."; exit 1; }

          echo "image=$(jq -r '.containerDefinitions[0].image' "$TASKDEF")"

      # revision 등록 → 서비스 갱신만 한다. 안정화 대기는 끈다.
      # 공식 액션(SDK waiter)의 대기는 wait-for-minutes보다 일찍 끝난 사례가 있어
      # (20분 설정, 약 12분에 TIMEOUT), 대기 시간을 다음 단계에서 직접 통제한다.
      - name: ECS 배포
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ runner.temp }}/taskdef.json
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: false

      # 배포가 최종 상태가 될 때까지 직접 기다린다.
      # - PRIMARY = 요청 revision, COMPLETED            → 성공
      # - PRIMARY = 다른 revision(circuit breaker 롤백) → 롤백이 COMPLETED가 될 때까지 기다린 뒤 실패
      # - 롤백 FAILED, 제한 시간 초과                    → 실패
      # 조회 오류는 일시적일 수 있으므로 제한 시간 안에서는 다시 조회한다.
      - name: 배포 결과 확인
        if: ${{ always() && steps.meta.outcome == 'success' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REASON: ${{ steps.meta.outputs.reason }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TEMPLATE_VERSION: ${{ steps.template.outputs.version }}
          REQUESTED: ${{ steps.deploy.outputs.task-definition-arn }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ROLLOUT_TIMEOUT: "1800" # 최종 상태 대기 제한: 30분 (실측 롤백 약 10분)
          POLL_INTERVAL: "15"
        run: |
          read_primary() {
            PRIMARY=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0]' \
              --output json 2>/dev/null || echo 'null')
            ACTUAL=$(echo "$PRIMARY" | jq -r '.taskDefinition // "unknown"')
            ROLLOUT=$(echo "$PRIMARY" | jq -r '.rolloutState // "unknown"')
            ROLLOUT_REASON=$(echo "$PRIMARY" | jq -r '.rolloutStateReason // ""')
          }

          RESULT="deploy-step-failed"
          ACTUAL="unknown"
          ROLLOUT="unknown"
          ROLLOUT_REASON=""
          REQUESTED_STATE=""

          if [[ "$DEPLOY_OUTCOME" == "success" && -n "$REQUESTED" ]]; then
            DEADLINE=$(( $(date +%s) + ROLLOUT_TIMEOUT ))
            RESULT="timeout"
            while true; do
              read_primary
              echo "$(date '+%T') primary=${ACTUAL##*/} rolloutState=${ROLLOUT}"
              if [[ "$ACTUAL" == "$REQUESTED" ]]; then
                REQUESTED_STATE="${ROLLOUT} ${ROLLOUT_REASON}"
                if [[ "$ROLLOUT" == "COMPLETED" ]]; then RESULT="success"; break; fi
              elif [[ "$ACTUAL" != "unknown" ]]; then
                if [[ "$ROLLOUT" == "COMPLETED" ]]; then RESULT="rolled-back"; break; fi
                if [[ "$ROLLOUT" == "FAILED" ]]; then RESULT="rollback-failed"; break; fi
              fi
              if [[ "$(date +%s)" -ge "$DEADLINE" ]]; then break; fi
              sleep "$POLL_INTERVAL"
            done
          else
            read_primary
          fi

          case "$RESULT" in
            success)            SUMMARY="성공" ;;
            rolled-back)        SUMMARY="실패: circuit breaker 롤백 완료 (현재 ${ACTUAL##*/})" ;;
            rollback-failed)    SUMMARY="실패: 롤백까지 실패. 즉시 수동 확인" ;;
            timeout)            SUMMARY="실패: ${ROLLOUT_TIMEOUT}초 안에 최종 상태가 되지 않음" ;;
            deploy-step-failed) SUMMARY="실패: ECS 배포 단계 실패 (outcome=${DEPLOY_OUTCOME})" ;;
          esac

          {
            echo "### AI dev V2(ECS) 배포 결과: ${SUMMARY}"
            echo "- 이벤트: ${GITHUB_EVENT_NAME}"
            echo "- 태그: \`${TAG}\`"
            echo "- 사유: ${REASON}"
            echo "- digest: \`${DIGEST:-조회 실패}\`"
            echo "- 템플릿: \`${TEMPLATE_KEY}\` (S3 버전 \`${TEMPLATE_VERSION:-조회 실패}\`)"
            echo "- 요청 revision: \`${REQUESTED:-등록 안 됨}\` (마지막 상태: ${REQUESTED_STATE:-확인 안 됨})"
            echo "- 현재 PRIMARY revision: \`${ACTUAL}\` (${ROLLOUT} ${ROLLOUT_REASON})"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RESULT" != "success" ]]; then
            echo "::error::V2 배포 ${SUMMARY}"
            exit 1
          fi
          echo "V2 배포 성공: ${ACTUAL}"
