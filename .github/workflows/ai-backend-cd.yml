name: AI CD

run-name: >-
  ${{ github.event_name == 'push'
      && format('AI prod V3 image promotion - {0}', github.sha)
      || format('AI V2 rollback - {0}', inputs.image_tag) }}

on:
  # main이 갱신되면 자동 배포 (develop→main 머지, hotfix→main 머지 모두 포함)
  push:
    branches: ["main"]
    # 문서만 바뀐 커밋으로 다운타임을 만들지 않는다.
    # CD는 필수 상태 체크가 아니므로 경로 필터를 써도 머지가 막히지 않는다.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

  # 수동 실행은 ECR에 이미 있는 이미지로 되돌리는 롤백 전용
  workflow_dispatch:
    inputs:
      image_tag:
        description: "롤백할 ECR 이미지 태그(7자리 SHA)"
        required: true
        type: string
      reason:
        description: "롤백 사유"
        required: true
        type: string

permissions: {}

# 같은 AI 레포의 운영 승격끼리만 직렬화한다.
concurrency:
  group: lookddak-ai-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lookddak-fastapi

jobs:
  # V2가 다시 활성화될 때만 Prod 전용 이미지를 빌드한다. 평상시 V3 승격은 Dev 이미지를 재사용한다.
  build-and-push:
    if: ${{ github.event_name == 'push' && vars.V2_PROD_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Guard - main 브랜치 확인
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "main 브랜치만 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - build role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # target을 지정하지 않는다 → 최종 runtime 이미지를 빌드한다.
      # runtime 단계가 test 단계의 통과 표시 파일을 COPY하므로
      # ruff/pytest가 실패하면 이미지가 만들어지지 않는다.
      - name: 빌드 및 ECR push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # V2 prod(ECS) 배포 코드는 긴급 재활성화를 위해 유지하지만 기본적으로 skip한다.
  # - Task Definition 설정은 CLOUD 레포 Terraform이 S3 템플릿으로 관리한다.
  #   이 job은 템플릿의 __DIGEST__만 이번 이미지 digest로 바꿔 revision을 등록한다.
  # V2 prod(ECS) 배포 동결 (2026-11-08): V3(EKS) 전환 준비 중 V2 prod 배포를 멈춘다 (서비스 중인 Task는 유지).
  # 저장소 변수 V2_PROD_DEPLOY_ENABLED를 두지 않으므로 skipped. 긴급 배포·롤백이 필요하면 변수를 'true'로 만들면 PR 없이 다시 켜진다.
  deploy-v2:
    name: prod-v2-deploy
    needs: build-and-push
    if: >-
      ${{
        always() &&
        vars.V2_PROD_DEPLOY_ENABLED == 'true' &&
        (
          (github.event_name == 'push' && needs.build-and-push.result == 'success') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      ECS_CLUSTER: lookddak-prod-v2
      ECS_SERVICE: lookddak-prod-v2-fastapi-service
      TASK_FAMILY: lookddak-prod-v2-fastapi
      TEMPLATE_KEY: prod/v2/fastapi.json
      APP_CONTAINER_NAME: fastapi
    steps:
      - name: Guard - main 브랜치 확인
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "main 브랜치의 워크플로만 운영에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: 배포 태그와 사유 확정
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_REASON: ${{ inputs.reason }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$BUILT_TAG"
            REASON="main push by ${GITHUB_ACTOR}"
          else
            TAG="$INPUT_TAG"
            REASON="$INPUT_REASON"
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "태그 형식이 잘못되었습니다: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<__EOF__"
            echo "$REASON"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 태그는 사람이 읽는 이름이고, 배포는 바뀌지 않는 digest로 한다.
      - name: 이미지 digest 조회
        id: image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text) \
          || { echo "ECR에 ${ECR_REPOSITORY}:${TAG} 이미지가 없습니다."; exit 1; }
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest 형식이 잘못되었습니다: '$DIGEST'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # 버킷 이름에 계정 ID가 들어가므로 레포에 적지 않고 실행 시 만든다.
      - name: Task Definition 템플릿 다운로드
        id: template
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lookddak-ecs-taskdef-${ACCOUNT}-${AWS_REGION}"
          VERSION=$(aws s3api get-object \
            --bucket "$BUCKET" --key "$TEMPLATE_KEY" \
            "$RUNNER_TEMP/template.json" \
            --query VersionId --output text)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repository_uri=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      # __DIGEST__만 바꾸고, 결과가 예상과 정확히 같은지 확인한다.
      # 앱 컨테이너는 이름(APP_CONTAINER_NAME)으로 찾는다. 모니터링 사이드카가 함께 있어도 앱 image만 바꾼다.
      # 다른 저장소 이미지나 다른 family로 바뀌지 않게 막는다.
      - name: digest 치환 및 검증
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPOSITORY_URI: ${{ steps.template.outputs.repository_uri }}
        run: |
          TEMPLATE="$RUNNER_TEMP/template.json"
          TASKDEF="$RUNNER_TEMP/taskdef.json"

          jq -e --arg family "$TASK_FAMILY" --arg name "$APP_CONTAINER_NAME" --arg image "${REPOSITORY_URI}@__DIGEST__" '
            .family == $family and
            ([.containerDefinitions[] | select(.name == $name)] | length) == 1 and
            (.containerDefinitions[] | select(.name == $name) | .image) == $image
          ' "$TEMPLATE" > /dev/null \
          || { echo "::error::템플릿이 예상과 다릅니다 (family, 앱 컨테이너 이름, image 확인)"; exit 1; }

          jq --arg name "$APP_CONTAINER_NAME" --arg digest "$DIGEST" \
            '(.containerDefinitions[] | select(.name == $name) | .image) |= sub("@__DIGEST__$"; "@" + $digest)' \
            "$TEMPLATE" > "$TASKDEF"

          if grep -q '__DIGEST__' "$TASKDEF"; then
            echo "::error::치환 후에도 __DIGEST__가 남아 있습니다."
            exit 1
          fi
          jq -e --arg name "$APP_CONTAINER_NAME" --arg image "${REPOSITORY_URI}@${DIGEST}" \
            '(.containerDefinitions[] | select(.name == $name) | .image) == $image' "$TASKDEF" > /dev/null \
          || { echo "::error::치환 결과 image가 예상과 다릅니다."; exit 1; }

          echo "image=$(jq -r --arg name "$APP_CONTAINER_NAME" '.containerDefinitions[] | select(.name == $name) | .image' "$TASKDEF")"

      # revision 등록 → 서비스 갱신만 한다. 안정화 대기는 끈다.
      # 공식 액션(SDK waiter)의 대기는 wait-for-minutes보다 일찍 끝난 사례가 있어
      # (20분 설정, 약 12분에 TIMEOUT), 대기 시간을 다음 단계에서 직접 통제한다.
      - name: ECS 배포
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ runner.temp }}/taskdef.json
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: false

      # 배포가 최종 상태가 될 때까지 직접 기다린다.
      # - PRIMARY = 요청 revision, COMPLETED            → 성공
      # - PRIMARY = 다른 revision(circuit breaker 롤백) → 롤백이 COMPLETED가 될 때까지 기다린 뒤 실패
      # - 롤백 FAILED, 제한 시간 초과                    → 실패
      # 조회 오류는 일시적일 수 있으므로 제한 시간 안에서는 다시 조회한다.
      - name: 배포 결과 확인
        if: ${{ always() && steps.meta.outcome == 'success' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REASON: ${{ steps.meta.outputs.reason }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TEMPLATE_VERSION: ${{ steps.template.outputs.version }}
          REQUESTED: ${{ steps.deploy.outputs.task-definition-arn }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ROLLOUT_TIMEOUT: "1800" # 최종 상태 대기 제한: 30분 (실측 롤백 약 10분)
          POLL_INTERVAL: "15"
        run: |
          read_primary() {
            PRIMARY=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0]' \
              --output json 2>/dev/null || echo 'null')
            ACTUAL=$(echo "$PRIMARY" | jq -r '.taskDefinition // "unknown"')
            ROLLOUT=$(echo "$PRIMARY" | jq -r '.rolloutState // "unknown"')
            ROLLOUT_REASON=$(echo "$PRIMARY" | jq -r '.rolloutStateReason // ""')
          }

          RESULT="deploy-step-failed"
          ACTUAL="unknown"
          ROLLOUT="unknown"
          ROLLOUT_REASON=""
          REQUESTED_STATE=""

          if [[ "$DEPLOY_OUTCOME" == "success" && -n "$REQUESTED" ]]; then
            DEADLINE=$(( $(date +%s) + ROLLOUT_TIMEOUT ))
            RESULT="timeout"
            while true; do
              read_primary
              echo "$(date '+%T') primary=${ACTUAL##*/} rolloutState=${ROLLOUT}"
              if [[ "$ACTUAL" == "$REQUESTED" ]]; then
                REQUESTED_STATE="${ROLLOUT} ${ROLLOUT_REASON}"
                if [[ "$ROLLOUT" == "COMPLETED" ]]; then RESULT="success"; break; fi
              elif [[ "$ACTUAL" != "unknown" ]]; then
                if [[ "$ROLLOUT" == "COMPLETED" ]]; then RESULT="rolled-back"; break; fi
                if [[ "$ROLLOUT" == "FAILED" ]]; then RESULT="rollback-failed"; break; fi
              fi
              if [[ "$(date +%s)" -ge "$DEADLINE" ]]; then break; fi
              sleep "$POLL_INTERVAL"
            done
          else
            read_primary
          fi

          case "$RESULT" in
            success)            SUMMARY="성공" ;;
            rolled-back)        SUMMARY="실패: circuit breaker 롤백 완료 (현재 ${ACTUAL##*/})" ;;
            rollback-failed)    SUMMARY="실패: 롤백까지 실패. 즉시 수동 확인" ;;
            timeout)            SUMMARY="실패: ${ROLLOUT_TIMEOUT}초 안에 최종 상태가 되지 않음" ;;
            deploy-step-failed) SUMMARY="실패: ECS 배포 단계 실패 (outcome=${DEPLOY_OUTCOME})" ;;
          esac

          {
            echo "### AI prod V2(ECS) 배포 결과: ${SUMMARY}"
            echo "- 이벤트: ${GITHUB_EVENT_NAME}"
            echo "- 태그: \`${TAG}\`"
            echo "- 사유: ${REASON}"
            echo "- digest: \`${DIGEST:-조회 실패}\`"
            echo "- 템플릿: \`${TEMPLATE_KEY}\` (S3 버전 \`${TEMPLATE_VERSION:-조회 실패}\`)"
            echo "- 요청 revision: \`${REQUESTED:-등록 안 됨}\` (마지막 상태: ${REQUESTED_STATE:-확인 안 됨})"
            echo "- 현재 PRIMARY revision: \`${ACTUAL}\` (${ROLLOUT} ${ROLLOUT_REASON})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::V2 배포 ${SUMMARY}"
            exit 1
          fi
          echo "V2 배포 성공: ${ACTUAL}"

  # V3 Prod(EKS)는 main에서 재빌드하지 않고 해당 Release에 포함된 Dev 검증 Digest를 승격한다.
  # V2가 재활성화돼도 이 Job은 build-and-push와 의존성이 없어 병렬로 실행된다.
  publish-v3-prod:
    name: publish-v3-prod
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: 승격 대상 Dev Commit 확인
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          DEV_SHA=$(gh api "repos/$REPOSITORY/commits/$MAIN_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main")][0].head.sha // empty')
          if [[ -z "$DEV_SHA" ]]; then DEV_SHA="$MAIN_SHA"; fi
          if [[ ! "$DEV_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::승격 대상 Dev commit SHA를 확인할 수 없습니다: '$DEV_SHA'"
            exit 1
          fi
          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"

      - name: 성공한 Dev CD 실행 확인
        id: dev-run
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_SHA: ${{ steps.source.outputs.dev_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RUN_ID=$(gh api --method GET \
            "repos/$REPOSITORY/actions/workflows/ai-backend-dev-cd.yml/runs" \
            -f head_sha="$DEV_SHA" -f status="success" -f event="push" -f per_page="10" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::$DEV_SHA 이미지가 성공한 AI dev CD에서 검증된 기록이 없습니다."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/$REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Dev 이미지 승격 증빙 다운로드
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dev-run.outputs.run_id }}
          DEV_SHA: ${{ steps.source.outputs.dev_sha }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ai-dev-image-$DEV_SHA" --dir "$RUNNER_TEMP/dev-image"

      - name: Dev 이미지 승격 증빙 검증
        id: image
        env:
          DEV_SHA: ${{ steps.source.outputs.dev_sha }}
        run: |
          PROVENANCE="$RUNNER_TEMP/dev-image/ai-dev-image.json"
          test -s "$PROVENANCE" || { echo "::error::Dev 이미지 증빙 파일이 없습니다."; exit 1; }
          RECORDED_SHA=$(jq -er '.source_sha' "$PROVENANCE")
          DIGEST=$(jq -er '.digest' "$PROVENANCE")
          if [[ "$RECORDED_SHA" != "$DEV_SHA" ]]; then
            echo "::error::증빙 Commit이 승격 대상과 다릅니다: expected=$DEV_SHA actual=$RECORDED_SHA"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::증빙 digest 형식이 잘못되었습니다: '$DIGEST'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: GitOps GitHub App Token 발급
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_IMAGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEV_IMAGE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: KTB4-15th-GITOPS
          permission-contents: write

      - name: GitOps Prod 이미지 승격 요청
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
          DEV_SHA: ${{ steps.source.outputs.dev_sha }}
          DEV_RUN_URL: ${{ steps.dev-run.outputs.run_url }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg event_type "prod-image-published" \
            --arg environment "prod" \
            --arg image_key "ai" \
            --arg digest "$DIGEST" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_run_url "$SOURCE_RUN_URL" \
            '{event_type: $event_type, client_payload: {environment: $environment, image_key: $image_key, digest: $digest, source_repository: $source_repository, source_sha: $source_sha, source_run_url: $source_run_url}}' \
          | gh api --method POST "repos/100-hours-a-week/KTB4-15th-GITOPS/dispatches" --input -

          {
            echo "### AI V3 Prod 이미지 승격 요청"
            echo "- Dev 검증 Commit: \`$DEV_SHA\`"
            echo "- Dev 검증 실행: $DEV_RUN_URL"
            echo "- 승격 Digest: \`$DIGEST\`"
            echo "- 영향 워크로드: \`chat-ai\`, \`body-image-validator\`, \`vton-orchestrator\`"
            echo "- GitOps 이벤트: \`prod-image-published\`"
          } >> "$GITHUB_STEP_SUMMARY"
