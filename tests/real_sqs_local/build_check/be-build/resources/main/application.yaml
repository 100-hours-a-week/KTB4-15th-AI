spring:
  application:
    name: lookddak
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

auth:
  cookie:
    secure: true
    same-site: Lax

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

ai:
  server:
    base-url: ${AI_SERVER_URL}
    api-key: ${AI_INTERNAL_API_KEY:}
    connect-timeout: 3s
    response-timeout: 60s
  chat-task:
    core-pool-size: ${AI_CHAT_CORE_POOL_SIZE:2}
    max-pool-size: ${AI_CHAT_MAX_POOL_SIZE:4}
    queue-capacity: ${AI_CHAT_QUEUE_CAPACITY:20}
    await-termination: ${AI_CHAT_AWAIT_TERMINATION:60s}
  fitting-task:
    core-pool-size: ${AI_FITTING_CORE_POOL_SIZE:1}
    max-pool-size: ${AI_FITTING_MAX_POOL_SIZE:1}
    queue-capacity: ${AI_FITTING_QUEUE_CAPACITY:5}
    await-termination: ${AI_FITTING_AWAIT_TERMINATION:120s}
  result-persistence-task:
    core-pool-size: ${AI_RESULT_PERSISTENCE_CORE_POOL_SIZE:1}
    max-pool-size: ${AI_RESULT_PERSISTENCE_MAX_POOL_SIZE:1}
    queue-capacity: ${AI_RESULT_PERSISTENCE_QUEUE_CAPACITY:50}
    await-termination: ${AI_RESULT_PERSISTENCE_AWAIT_TERMINATION:30s}

aws:
  sqs:
    region: ${AWS_REGION:ap-northeast-2}
    fitting-request-queue-url: ${BE_FITTING_REQUEST_QUEUE_URL:}
    fitting-response-queue-url: ${BE_FITTING_RESPONSE_QUEUE_URL:}
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiration: 10m

fitting:
  outbox:
    enabled: ${FITTING_OUTBOX_ENABLED:false}
    server-id: ${FITTING_OUTBOX_SERVER_ID:${HOSTNAME:local}}
    poll-interval: ${FITTING_OUTBOX_POLL_INTERVAL:1s}
    batch-size: ${FITTING_OUTBOX_BATCH_SIZE:20}
    lease-duration: ${FITTING_OUTBOX_LEASE_DURATION:30s}
  result-consumer:
    enabled: ${FITTING_RESULT_CONSUMER_ENABLED:false}
    poll-interval: ${FITTING_RESULT_CONSUMER_POLL_INTERVAL:1s}
    max-messages: ${FITTING_RESULT_CONSUMER_MAX_MESSAGES:10}
    wait-time-seconds: ${FITTING_RESULT_CONSUMER_WAIT_TIME_SECONDS:10}
    visibility-timeout-seconds: ${FITTING_RESULT_CONSUMER_VISIBILITY_TIMEOUT_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  sample-rate: ${SENTRY_SAMPLE_RATE:1.0}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  logging:
    enabled: true
    minimum-event-level: error
    minimum-breadcrumb-level: info
