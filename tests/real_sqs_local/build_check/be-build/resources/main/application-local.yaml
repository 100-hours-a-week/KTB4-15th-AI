spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

auth:
  cookie:
    secure: false

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

ai:
  server:
    base-url: ${AI_SERVER_URL:http://localhost:8000}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:lookddak-dev-images-686496667254-ap-northeast-2}
