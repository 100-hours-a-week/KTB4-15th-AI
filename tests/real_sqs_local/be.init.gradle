allprojects {
    // All compiled classes, reports and task state belong to this new test run.
    layout.buildDirectory.set(file(System.getenv('REAL_SQS_ARTIFACT_DIR') + '/be-build'))
    afterEvaluate {
        if (plugins.hasPlugin('java')) {
            sourceSets.test.java.setSrcDirs([System.getenv('REAL_SQS_TEST_DIR') + '/java'])
            tasks.named('test') {
                filter { includeTestsMatching 'com.ktb.lookddak.integration.RealSqsLocalTest' }
                outputs.upToDateWhen { false }
                testLogging { events 'failed'; showStandardStreams = true }
            }
        }
    }
}
